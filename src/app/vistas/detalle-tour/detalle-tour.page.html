<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/catalogo"></ion-back-button>
    </ion-buttons>
    <ion-title>Detalles del Tour</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light">

  <div class="ion-text-center ion-margin-top" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando información...</p>
  </div>

  <div class="ion-text-center ion-padding" *ngIf="!cargando && !tour">
    <h2>Ups... 😕</h2>
    <p>No pudimos encontrar este tour. Es posible que haya sido eliminado.</p>
    <ion-button routerLink="/tabs/catalogo" fill="clear">Volver al catálogo</ion-button>
  </div>

  <div *ngIf="!cargando && tour">
    
    <div style="position: relative;">
      <img [src]="tour.imagenUrl" alt="Tour" style="width: 100%; height: 300px; object-fit: cover;" />
      <ion-badge color="success" style="position: absolute; bottom: 15px; right: 15px; font-size: 16px; padding: 8px;">
        ${{ tour.precio }} COP
      </ion-badge>
    </div>

    <div class="ion-padding">
      <h1 style="margin-top: 0;">{{ tour.titulo }}</h1>
      <ion-text color="medium">
        <p style="font-size: 16px; line-height: 1.5;">{{ tour.descripcion }}</p>
      </ion-text>
    </div>
    
  </div>

</ion-content>

<ion-footer class="ion-no-border ion-padding-bottom" *ngIf="!cargando && tour">
  <ion-toolbar>
    <ion-row>
      <ion-col size="6">
        <ion-button expand="block" color="success" shape="round" (click)="abrirWhatsApp()">
          <ion-icon slot="start" name="logo-whatsapp"></ion-icon>
          WhatsApp
        </ion-button>
      </ion-col>
      <ion-col size="6">
        <ion-button expand="block" color="warning" shape="round" (click)="apartarCupo()" [disabled]="procesandoReserva">
          <ion-spinner *ngIf="procesandoReserva" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!procesandoReserva" slot="start" name="card-outline"></ion-icon>
          <span *ngIf="!procesandoReserva">Reservar</span>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-toolbar>
</ion-footer>
