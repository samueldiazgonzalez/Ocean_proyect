<ion-content class="login-content">

  <!-- Fondo con overlay -->
  <div class="login-bg-overlay"></div>

  <div class="login-container">

    <!-- Logo -->
    <div class="login-logo">
      <div class="logo-icono">
        <ion-icon name="water-outline"></ion-icon>
      </div>
      <div class="logo-texto">
        <span class="logo-nombre">Ocean</span>
        <span class="logo-slogan">Explora el mundo</span>
      </div>
    </div>

    <!-- Título hero -->
    <div class="login-hero">
      <h1 class="login-titulo">Bienvenido <span class="login-titulo-highlight">de vuelta</span></h1>
      <p class="login-subtitulo">Tu próxima aventura te espera</p>
    </div>

    <!-- Card del formulario -->
    <div class="login-card">

      <!-- Campo correo -->
      <div class="campo-grupo">
        <span class="campo-label">Correo electrónico</span>
        <div class="campo-inner">
          <ion-icon name="mail-outline" class="campo-icon"></ion-icon>
          <ion-input
            [(ngModel)]="correo"
            type="email"
            placeholder="ejemplo@ocean.com"
            class="campo-input">
          </ion-input>
        </div>
      </div>

      <!-- Campo contraseña -->
      <div class="campo-grupo">
        <span class="campo-label">Contraseña</span>
        <div class="campo-inner">
          <ion-icon name="lock-closed-outline" class="campo-icon"></ion-icon>
          <ion-input
            [(ngModel)]="contrasena"
            type="password"
            placeholder="••••••••"
            class="campo-input">
          </ion-input>
        </div>
      </div>

      <!-- Error -->
      <div class="error-msg" *ngIf="mensajeError">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>{{ mensajeError }}</span>
      </div>

      <!-- Botón principal -->
      <button class="btn-principal" (click)="iniciarSesion()" [disabled]="cargando">
        <ion-spinner *ngIf="cargando" name="crescent" class="btn-spinner"></ion-spinner>
        <span *ngIf="!cargando">Iniciar Sesión</span>
        <ion-icon *ngIf="!cargando" name="arrow-forward-outline"></ion-icon>
      </button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-linea"></div>
        <span class="divider-texto">o continúa con</span>
        <div class="divider-linea"></div>
      </div>

      <!-- Google -->
      <button class="btn-google" (click)="iniciarSesionGoogle()" [disabled]="cargando">
        <div class="google-dot">G</div>
        Continuar con Google
      </button>

      <!-- Registro -->
      <button class="btn-registro" (click)="irARegistro()">
        Crear una cuenta nueva
      </button>

      <!-- Explorar sin cuenta -->
      <button class="btn-ghost" routerLink="/tabs/catalogo">
        Explorar catálogo sin cuenta
        <ion-icon name="compass-outline"></ion-icon>
      </button>

    </div>
  </div>

</ion-content>
