<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-title>Mis Favoritos ❤️</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content color="light" class="ion-padding">
  <div class="ion-text-center ion-margin-bottom" *ngIf="!cargando && toursFavoritos.length > 0">
    <h2>Tu lista de deseos</h2>
    <p>Experiencias que te encantaron</p>
  </div>

  <div class="ion-text-center ion-padding" *ngIf="cargando">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando tus favoritos...</p>
  </div>

  <div class="ion-text-center ion-padding" *ngIf="!cargando && toursFavoritos.length === 0">
    <ion-icon name="heart-outline" style="font-size: 80px; color: #ccc;"></ion-icon>
    <h2>Aún no tienes favoritos</h2>
    <p>Explora el catálogo y toca el corazón para guardar los tours que más te gusten.</p>
    <ion-button routerLink="/tabs/catalogo" fill="clear">Ir al catálogo</ion-button>
  </div>

  <ion-list lines="none" style="background: transparent;">
    <ion-card *ngFor="let tour of toursFavoritos" class="ion-margin-bottom" style="border-radius: 15px;">
      <img [src]="tour.imagenUrl" style="height: 150px; width: 100%; object-fit: cover;" />
      <ion-card-header>
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <ion-card-title style="font-size: 1.1rem; font-weight: bold;">{{ tour.titulo }}</ion-card-title>
          <ion-badge color="secondary">{{ tour.categoria }}</ion-badge>
        </div>
        <ion-card-subtitle color="success">${{ tour.precio }} COP</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" shape="round" [routerLink]="['/detalle-tour', tour.id]">
          Ver Detalles
          <ion-icon slot="end" name="arrow-forward-outline"></ion-icon>
        </ion-button>
      </ion-card-content>
    </ion-card>
  </ion-list>
</ion-content>
